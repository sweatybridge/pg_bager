[package]
name = "pg_bager"
version = "0.1.3"
edition = "2021"
description = "A psql pager filter that renders PNG bytea cells as terminal images"
license = "MIT"

[[bin]]
name = "pg_bager"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["gif", "png"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"
