name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.toml

permissions:
  contents: write

jobs:
  version:
    name: Detect version change
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.version.outputs.current }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v6

      - name: Check Cargo.toml version tag
        id: version
        run: |
          version=$(grep -oP '^version = "\K[^"]+' Cargo.toml)
          echo "current=$version" >> "$GITHUB_OUTPUT"
          gh release view "v$version" || status=$?
          echo "changed=$status" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.changed == '1'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: pg_bager
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: pg_bager
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: pg_bager.exe
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Package binary
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.version.outputs.current }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          asset="pg_bager-${VERSION}-${TARGET}"
          mkdir -p "dist/${asset}"
          cp "target/${TARGET}/release/${BINARY}" "dist/${asset}/"
          tar -czf "dist/${asset}.tar.gz" -C dist "${asset}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: pg_bager-${{ needs.version.outputs.current }}-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Upload GitHub release assets
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.current }}
          name: ${{ needs.version.outputs.current }}
          generate_release_notes: true
          files: dist/*.tar.gz
