name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.toml

permissions:
  contents: write

jobs:
  version:
    name: Detect version change
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.version.outputs.current }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@v6

      - name: Check Cargo.toml version tag
        id: version
        run: |
          set -euo pipefail

          version="$(
            awk '
              /^\[package\]/ { in_package = 1; next }
              /^\[/ && in_package { exit }
              in_package && /^[[:space:]]*version[[:space:]]*=/ {
                value = $0
                sub(/^[^=]*=[[:space:]]*/, "", value)
                gsub(/^[[:space:]]*"|"[[:space:]]*$/, "", value)
                print value
                exit
              }
            ' Cargo.toml
          )"

          if [[ -z "${version}" ]]; then
            echo "Unable to read package.version from Cargo.toml" >&2
            exit 1
          fi

          current="v${version}"
          exists=false

          if git ls-remote --exit-code --tags origin "refs/tags/${current}" >/dev/null; then
            exists=true
          fi

          {
            echo "current=${current}"
            echo "exists=${exists}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.exists != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: pg_bager
          - os: macos-13
            target: x86_64-apple-darwin
            binary: pg_bager
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: pg_bager.exe
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.version.outputs.current }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          asset="pg_bager-${VERSION}-${TARGET}"
          mkdir -p "dist/${asset}"
          cp "target/${TARGET}/release/${BINARY}" "dist/${asset}/"
          tar -czf "dist/${asset}.tar.gz" -C dist "${asset}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pg_bager-${{ needs.version.outputs.current }}-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Upload GitHub release assets
    needs:
      - version
      - build
    if: needs.version.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.current }}
          name: ${{ needs.version.outputs.current }}
          generate_release_notes: true
          files: dist/*.tar.gz
