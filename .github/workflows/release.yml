name: Release

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml

permissions:
  contents: write

jobs:
  version:
    name: Detect version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compare Cargo.toml package version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          current = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          before_sha = os.environ.get("BEFORE_SHA", "")
          previous = ""

          if before_sha and before_sha != "0000000000000000000000000000000000000000":
              try:
                  previous_toml = subprocess.check_output(
                      ["git", "show", f"{before_sha}:Cargo.toml"],
                      stderr=subprocess.DEVNULL,
                  )
                  previous = tomllib.loads(previous_toml.decode())["package"]["version"]
              except Exception:
                  previous = ""

          print(f"changed={str(bool(previous and previous != current)).lower()}")
          print(f"version={current}")
          print(f"tag=v{current}")
          PY

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: pg_bager
          - os: macos-13
            target: x86_64-apple-darwin
            binary: pg_bager
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: pg_bager.exe
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          asset="pg_bager-${VERSION}-${TARGET}"
          mkdir -p "dist/${asset}"
          cp "target/${TARGET}/release/${BINARY}" "dist/${asset}/"
          tar -czf "dist/${asset}.tar.gz" -C dist "${asset}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pg_bager-${{ needs.version.outputs.version }}-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Upload GitHub release assets
    needs:
      - version
      - build
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*.tar.gz
