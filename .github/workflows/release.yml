name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.toml

permissions:
  contents: write

jobs:
  version:
    name: Detect version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      latest_tag: ${{ steps.version.outputs.latest_tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Compare Cargo.toml version with latest release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          version="$(
            awk '
              /^\[package\]/ { in_package = 1; next }
              /^\[/ && in_package { exit }
              in_package && /^[[:space:]]*version[[:space:]]*=/ {
                value = $0
                sub(/^[^=]*=[[:space:]]*/, "", value)
                gsub(/^[[:space:]]*"|"[[:space:]]*$/, "", value)
                print value
                exit
              }
            ' Cargo.toml
          )"

          if [[ -z "${version}" ]]; then
            echo "Unable to read package.version from Cargo.toml" >&2
            exit 1
          fi

          current_tag="v${version}"
          latest_tag=""

          if ! latest_tag="$(gh api "repos/${REPOSITORY}/releases/latest" --jq .tag_name 2>gh-api-error.log)"; then
            if grep -q "HTTP 404" gh-api-error.log; then
              latest_tag=""
            else
              cat gh-api-error.log >&2
              exit 1
            fi
          fi

          changed=false
          if [[ "${latest_tag}" != "${current_tag}" ]]; then
            changed=true
          fi

          {
            echo "changed=${changed}"
            echo "version=${version}"
            echo "tag=${current_tag}"
            echo "latest_tag=${latest_tag}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: pg_bager
          - os: macos-13
            target: x86_64-apple-darwin
            binary: pg_bager
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: pg_bager.exe
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          asset="pg_bager-${VERSION}-${TARGET}"
          mkdir -p "dist/${asset}"
          cp "target/${TARGET}/release/${BINARY}" "dist/${asset}/"
          tar -czf "dist/${asset}.tar.gz" -C dist "${asset}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pg_bager-${{ needs.version.outputs.version }}-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Upload GitHub release assets
    needs:
      - version
      - build
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*.tar.gz
