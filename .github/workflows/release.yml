name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.toml

permissions:
  contents: write

jobs:
  version:
    name: Detect version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      latest_tag: ${{ steps.version.outputs.latest_tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Compare Cargo.toml version with latest release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          current = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          current_tag = f"v{current}"
          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          latest_tag = ""

          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/releases/latest",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request) as response:
                  latest_tag = json.loads(response.read())["tag_name"]
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise

          changed = latest_tag != current_tag

          print(f"changed={str(changed).lower()}")
          print(f"version={current}")
          print(f"tag={current_tag}")
          print(f"latest_tag={latest_tag}")
          PY

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: pg_bager
          - os: macos-13
            target: x86_64-apple-darwin
            binary: pg_bager
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: pg_bager.exe
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          asset="pg_bager-${VERSION}-${TARGET}"
          mkdir -p "dist/${asset}"
          cp "target/${TARGET}/release/${BINARY}" "dist/${asset}/"
          tar -czf "dist/${asset}.tar.gz" -C dist "${asset}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pg_bager-${{ needs.version.outputs.version }}-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Upload GitHub release assets
    needs:
      - version
      - build
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*.tar.gz
